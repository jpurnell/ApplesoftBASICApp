enabledCheckers:
  - test
  - safety
  - doc-lint
  - doc-coverage
  - unreachable
  - recursion
  - concurrency
  - pointer-escape
  - memory-builder
  - accessibility
  - status
  - swift-version
  - logging
  - test-quality
  - context
  - dependency-audit
  - release-readiness
  - fp-safety
  - stochastic-determinism
  - memory-lifecycle
  - mcp-readiness
  - process-safety
  - liveness
  - complexity
  - hig-auditor
  - appintents-readiness
  - consistency
  - xcode-build

# This is an iPad app (SDKROOT=iphoneos, TARGETED_DEVICE_FAMILY=2), so the
# unreachable checker's cross-module pass needs a fresh Xcode index store.
# Auto-build refreshes it before analysis; without a matching destination,
# xcodebuild defaults to macOS and falls back to mismatched iPhone simulators,
# which fails the build and silently skips cross-module reachability.
unreachableAutoBuildXcode: true
xcodeDestination: "generic/platform=iOS Simulator"

consistency:
  corpusPath: /Users/jpurnell/Dropbox/Computer/Development/Swift/Tools/org-judgement-corpus
  projectID: ApplesoftBASICApp
  consistencyThreshold: 0.7
  defaultRiskTier: 2

# v2 layout: the master plan is project-owned, not framework content.
status:
  guidelinesPath: "."
  masterPlanPath: project/master_plan.md

# Refuse to trust a gate binary older than this. A stale binary silently runs
# old rules; without this pin nothing says so. Ratchet on each deploy that the
# repo depends on. Warns on every run; fails only under --strict.
minimumGateVersion: "2026-08-26"
