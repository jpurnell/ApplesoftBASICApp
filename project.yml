name: ApplesoftBASICApp
options:
  bundleIdPrefix: com.justinpurnell
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "17.0"

packages:
  ApplesoftBASIC:
    url: https://github.com/jpurnell/ApplesoftBASIC.git
    branch: main
  ApplesoftBASICAppCore:
    path: .

targets:
  ApplesoftBASICApp:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ViewModels
      - path: Views
      - path: IO
      - path: Theme
      - path: Sound
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Resources/Samples
        type: folder
        buildPhase: resources
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: ApplesoftBASIC
        product: ApplesoftBASICLib
      - package: ApplesoftBASICAppCore
        product: ApplesoftBASICAppCore
    info:
      path: Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Fonts/PrintChar21.ttf
          - Fonts/PRNumber3.ttf
    settings:
      base:
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: com.justinpurnell.ApplesoftBASIC
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: BNDA9Y6YV9
        # iPad (2) + visionOS (7); macOS comes from SUPPORTED_PLATFORMS below.
        TARGETED_DEVICE_FAMILY: "2,7"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx xros xrsimulator"
        SUPPORTS_MAC_DESIGNED_FOR_IPAD: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        REGISTER_APP_GROUPS: YES
